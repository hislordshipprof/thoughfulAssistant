appId: com.audio-device-helper.app
productName: AudioDeviceHelper
executableName: AudioDeviceHelper
copyright: Copyright © 2024
npmRebuild: false
directories:
  output: release
  buildResources: assets
files:
  - out/**/*
extraResources:
  - from: build/Release/
    to: native/
    filter:
      - "*.node"
win:
  icon: assets/icons/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
